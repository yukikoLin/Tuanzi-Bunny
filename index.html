<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="小糰兔的療癒日常。今天也一起在天空裡，慢慢過日子吧。"
    />
    <meta name="theme-color" content="#bfe7f4" />
    <title>小糰兔｜慢慢過日子吧</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
    <script src="./script.js?v=2" defer></script>
  </head>
  <body>
    <main>
      <section class="sky-journey" id="sky" aria-labelledby="hero-title">
        <div class="scene scene--sky">
        <div class="rainbow-field" aria-hidden="true">
          <div class="rainbow-arc"></div>
        </div>

        <div class="cloud-field" aria-hidden="true">
          <div class="painted-cloud cloud-layer--mid cloud--1">
            <img src="./assets/clouds/cloud-02.png?v=1" alt="" width="680" height="470" />
          </div>
          <div class="painted-cloud cloud-layer--far cloud--2">
            <img src="./assets/clouds/cloud-03.png?v=1" alt="" width="470" height="380" />
          </div>
          <div class="painted-cloud cloud-layer--far cloud--3">
            <img src="./assets/clouds/cloud-08.png?v=1" alt="" width="470" height="240" />
          </div>
          <div class="painted-cloud cloud-layer--front cloud--4">
            <img src="./assets/clouds/cloud-01.png?v=1" alt="" width="670" height="530" />
          </div>
          <div class="painted-cloud cloud-layer--front cloud--5">
            <img src="./assets/clouds/cloud-07.png?v=1" alt="" width="760" height="320" />
          </div>
          <div class="painted-cloud cloud-layer--mid cloud--6">
            <img src="./assets/clouds/cloud-04.png?v=1" alt="" width="720" height="410" />
          </div>
          <div class="painted-cloud cloud-layer--mid cloud--7">
            <img src="./assets/clouds/cloud-03.png?v=1" alt="" width="470" height="380" />
          </div>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">Tuanzi Bunny</p>
          <h1 id="hero-title">
            今天也跟小糰兔一起，<br />
            <span>慢慢過日子吧。</span>
          </h1>
          <p class="hero-note">把步伐放輕一點，也很好。</p>
        </div>

        <div class="bunny-stage">
          <div class="bunny-float">
            <img
              class="bunny"
              src="./assets/float-bunny.png?v=2"
              alt="戴著紅領巾、在藍天中輕輕漂浮的小糰兔"
              width="1439"
              height="1934"
              fetchpriority="high"
            />
          </div>
        </div>

        <a class="scroll-cue" href="#next-scene" aria-label="向下捲動探索下一幕">
          <span>SCROLL</span>
          <span class="scroll-line" aria-hidden="true"></span>
        </a>

        <svg class="paper-grain" aria-hidden="true">
          <filter id="paper-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#paper-noise)" />
        </svg>
        </div>
      </section>

      <section class="scene-handoff" id="next-scene" aria-label="下一幕預留區">
        <p>小糰兔的下一段旅程，正在雲後慢慢長出來。</p>
      </section>
    </main>
  </body>
</html>
