<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="小糰兔的療癒日常。今天也一起在天空裡，慢慢過日子吧。"
    />
    <meta name="theme-color" content="#bfe7f4" />
    <title>小糰兔｜慢慢過日子吧</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="scene scene--sky" id="sky" aria-labelledby="hero-title">
        <div class="sky-artwork" aria-hidden="true">
          <img src="./assets/hero-sky.png" alt="" width="1672" height="941" />
        </div>

        <div class="hero-copy" data-parallax="0.08">
          <p class="eyebrow">Tuanzi Bunny</p>
          <h1 id="hero-title">
            今天也跟小糰兔一起，<br />
            <span>慢慢過日子吧。</span>
          </h1>
          <p class="hero-note">把步伐放輕一點，也很好。</p>
        </div>

        <div class="bunny-stage" data-parallax="-0.06">
          <div class="bunny-float">
            <img
              class="bunny"
              src="./assets/float-bunny.png"
              alt="戴著紅領巾、在藍天中輕輕漂浮的小糰兔"
              width="1439"
              height="1934"
              fetchpriority="high"
            />
          </div>
        </div>

        <a class="scroll-cue" href="#next-scene" aria-label="向下捲動探索下一幕">
          <span>SCROLL</span>
          <span class="scroll-line" aria-hidden="true"></span>
        </a>

        <svg class="paper-grain" aria-hidden="true">
          <filter id="paper-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#paper-noise)" />
        </svg>
      </section>

      <section class="scene-handoff" id="next-scene" aria-label="下一幕預留區">
        <p>小糰兔的下一段旅程，正在雲後慢慢長出來。</p>
      </section>
    </main>
  </body>
</html>
